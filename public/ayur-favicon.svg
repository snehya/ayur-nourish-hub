<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Primary gradient for main elements -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <!-- Secondary gradient for accent elements -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <!-- Radial gradient for depth -->
    <radialGradient id="depthGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle with subtle shadow -->
  <circle cx="16" cy="16" r="15" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  
  <!-- Outer decorative ring -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="url(#accentGrad)" stroke-width="0.5" opacity="0.8"/>
  
  <!-- Main Ayurvedic leaf symbol -->
  <g transform="translate(16,16)">
    <!-- Central leaf (larger) -->
    <path d="M0,-10 C-4,-8 -6,-4 -6,0 C-6,4 -4,8 0,10 C4,8 6,4 6,0 C6,-4 4,-8 0,-10Z" 
          fill="url(#accentGrad)" opacity="0.9"/>
    
    <!-- Left leaf -->
    <path d="M-7,-5 C-9,-4 -10,-2 -10,0 C-10,2 -9,4 -7,5 C-5,4 -4,2 -4,0 C-4,-2 -5,-4 -7,-5Z" 
          fill="#ffffff" opacity="0.8" transform="rotate(-30)"/>
    
    <!-- Right leaf -->
    <path d="M7,-5 C9,-4 10,-2 10,0 C10,2 9,4 7,5 C5,4 4,2 4,0 C4,-2 5,-4 7,-5Z" 
          fill="#ffffff" opacity="0.8" transform="rotate(30)"/>
    
    <!-- Central vein -->
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
    
    <!-- Small decorative dots (representing balance) -->
    <circle cx="0" cy="-3" r="0.8" fill="#ffffff" opacity="0.7"/>
    <circle cx="0" cy="0" r="1" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="3" r="0.8" fill="#ffffff" opacity="0.7"/>
  </g>
  
  <!-- Subtle highlight on top -->
  <ellipse cx="16" cy="8" rx="8" ry="3" fill="url(#depthGrad)"/>
  
  <!-- Small wellness symbols around the border -->
  <g fill="#ffffff" opacity="0.6" font-family="Arial, sans-serif" font-size="2" text-anchor="middle">
    <!-- OM symbol stylized -->
    <text x="16" y="5" font-size="3">॰</text>
    <!-- Wellness dots -->
    <circle cx="8" cy="10" r="0.5"/>
    <circle cx="24" cy="10" r="0.5"/>
    <circle cx="8" cy="22" r="0.5"/>
    <circle cx="24" cy="22" r="0.5"/>
  </g>
</svg>